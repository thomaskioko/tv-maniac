name: 'Setup Gradle Environment'
description: 'Common setup for Gradle builds with JDK 21 and environment variables'

inputs:
  gradle-cache-disabled:
    description: 'Disable Gradle cache (default: false = cache enabled). Only set to true for baseline-profile workflow.'
    required: false
    default: 'false'
  gradle-cache-read-only:
    description: 'Make Gradle cache read-only (default: auto-detected from event type). PRs read cache but do not write.'
    required: false
    default: ${{ github.event_name == 'pull_request' }}

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-provider: basic
        cache-disabled: ${{ inputs.gradle-cache-disabled }}
        cache-read-only: ${{ inputs.gradle-cache-read-only }}

    - name: 🐘 Size Gradle for the Linux runner
      if: runner.os == 'Linux'
      shell: bash
      run: |
        GRADLE_HOME_DIR="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$GRADLE_HOME_DIR"
        {
          echo "org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseStringDeduplication -XX:MaxMetaspaceSize=2g -Xmx5g"
          echo "kotlin.daemon.jvmargs=-Xmx3g"
        } >> "$GRADLE_HOME_DIR/gradle.properties"
        cat "$GRADLE_HOME_DIR/gradle.properties"
