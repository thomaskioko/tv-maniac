name: 'Setup iOS Environment'
description: 'Common setup for iOS builds with Xcode, Ruby, SPM cache, and Gradle'

inputs:
  xcode-version:
    description: 'Xcode version to use'
    required: true
  spm-cache-path:
    description: 'Path to SPM dependencies for caching'
    required: false
    default: 'ios/SourcePackages'
  gradle-cache-read-only:
    description: 'Forwarded to setup-gradle. Defaults to read-only on pull requests; set false for the cache-writing job.'
    required: false
    default: ${{ github.event_name == 'pull_request' }}
  kotlin-tooling:
    description: 'Set false for jobs that never call Gradle, so they skip the Kotlin/Native and Gradle caches.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: 📀 Setup Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: 📱 Verify Simulator Availability
      shell: bash
      run: |
        echo "Xcode: $(xcodebuild -version | head -1)"
        echo "Available iOS runtimes:"
        xcrun simctl list runtimes iOS
        echo "Available iPhone simulators:"
        xcrun simctl list devices available iPhone

    - name: 💎 Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Cache SPM dependencies
      uses: actions/cache@v6
      with:
        path: ${{ inputs.spm-cache-path }}
        key: ${{ runner.os }}-spm-${{ hashFiles('ios/tv-maniac.xcodeproj/project.pbxproj', 'ios/Packages/**/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: 🔑 Resolve Kotlin version
      id: kotlin
      if: inputs.kotlin-tooling == 'true'
      shell: bash
      run: |
        echo "version=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

    - name: 🗂️ Cache Kotlin/Native (konan)
      if: inputs.kotlin-tooling == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ steps.kotlin.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: 🐘 Setup Gradle
      if: inputs.kotlin-tooling == 'true'
      uses: ./.github/actions/setup-gradle
      with:
        gradle-cache-read-only: ${{ inputs.gradle-cache-read-only }}

    - name: 🐘 Size Gradle for the macOS runner
      if: inputs.kotlin-tooling == 'true'
      shell: bash
      run: |
        GRADLE_HOME_DIR="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$GRADLE_HOME_DIR"
        {
          echo "org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseStringDeduplication -XX:MaxMetaspaceSize=1g -Xmx4g"
          echo "kotlin.daemon.jvmargs=-Xmx1g"
          echo "org.gradle.console=plain"
        } >> "$GRADLE_HOME_DIR/gradle.properties"
        cat "$GRADLE_HOME_DIR/gradle.properties"
