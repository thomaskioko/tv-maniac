name: Beta Release

on:
  workflow_dispatch:
    inputs:
      skip_android:
        description: 'Skip Android build'
        type: boolean
        default: false
      skip_ios:
        description: 'Skip iOS build'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

env:
  XCODE_VERSION: 26.5
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
  TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
  TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
  SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
  SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
  SIMKL_REDIRECT_URI: ${{ secrets.SIMKL_REDIRECT_URI }}

jobs:
  build-android:
    if: ${{ !inputs.skip_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Android Release
        uses: ./.github/actions/setup-android-release
        with:
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          signing-encrypt-key: ${{ secrets.SIGNING_ENCRYPT_KEY }}

      - name: Write build number
        id: version
        run: ./scripts/ci/write-build-number.sh

      - name: Build release AAB and APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease \
            -Pandroidx.baselineprofile.skipgeneration=true \
            -Papp.debugOnly=false \
            -Papp.versionSuffix=-beta \
            -PreleaseStoreFile=release/app-release.jks \
            -PreleaseStorePassword="$SIGNING_STORE_PASSWORD" \
            -PreleaseKeyAlias=tvmaniac \
            -PreleaseKeyPassword="$SIGNING_KEY_PASSWORD" \
            --no-configuration-cache

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-beta-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 5
          overwrite: true
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-beta-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 5
          overwrite: true
          if-no-files-found: error

  deploy-play-beta:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Decrypt Play service account
        env:
          SIGNING_ENCRYPT_KEY: ${{ secrets.SIGNING_ENCRYPT_KEY }}
        run: openssl aes-256-cbc -d -pbkdf2 -in release/play-service-account.aes -out release/play-service-account.json -k "$SIGNING_ENCRYPT_KEY"

      - name: Download AAB artifact
        uses: actions/download-artifact@v7
        with:
          name: android-beta-aab
          path: app/build/outputs/bundle/release

      - name: Deploy to Play Store open testing track
        run: |
          PLAY_STORE_SERVICE_ACCOUNT_JSON=$(cat release/play-service-account.json)
          export PLAY_STORE_SERVICE_ACCOUNT_JSON
          bundle exec fastlane android deploy_play_store track:beta
          echo "Published **${{ needs.build-android.outputs.version }}-beta** build \`${{ needs.build-android.outputs.build }}\` to the Play Store open testing track" >> "$GITHUB_STEP_SUMMARY"

  deploy-firebase:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Decrypt Firebase service account
        env:
          SIGNING_ENCRYPT_KEY: ${{ secrets.SIGNING_ENCRYPT_KEY }}
        run: openssl aes-256-cbc -d -pbkdf2 -in release/firebase-sa.aes -out release/firebase-sa.json -k "$SIGNING_ENCRYPT_KEY"

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: android-beta-apk
          path: app/build/outputs/apk/release

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "error: FIREBASE_APP_ID secret is not set" >&2
            exit 1
          fi
          export FIREBASE_APP_DISTRIBUTION_SA=release/firebase-sa.json
          bundle exec fastlane android distribute_firebase
          echo "Published **${{ needs.build-android.outputs.version }}-beta** build \`${{ needs.build-android.outputs.build }}\` to Firebase App Distribution" >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    if: ${{ !inputs.skip_ios }}
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup iOS Release
        uses: ./.github/actions/setup-ios-release
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          google-service-info-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_RELEASE }}

      - name: Write build number
        id: version
        run: ./scripts/ci/write-build-number.sh

      - name: Build signed IPA
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane ios build_ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-beta-ipa
          path: build/tv-maniac.ipa
          retention-days: 5
          overwrite: true
          if-no-files-found: error

      - name: Upload build logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-beta-logs
          path: fastlane/logs
          overwrite: true

  deploy-testflight:
    needs: build-ios
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download IPA artifact
        uses: actions/download-artifact@v7
        with:
          name: ios-beta-ipa
          path: build

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          bundle exec fastlane ios upload_testflight
          echo "Published **${{ needs.build-ios.outputs.version }}** build \`${{ needs.build-ios.outputs.build }}\` to TestFlight" >> "$GITHUB_STEP_SUMMARY"
