name: iOS Binary Size

on:
    push:
        branches: [ main ]
    workflow_dispatch:

env:
    XCODE_VERSION: 26.5
    TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
    TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
    TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
    SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
    SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
    SIMKL_REDIRECT_URI: ${{ secrets.SIMKL_REDIRECT_URI }}

jobs:
    measure:
        runs-on: macos-26
        timeout-minutes: 60
        steps:
            -   uses: actions/checkout@v7

            -   name: 📱 Setup iOS Environment
                uses: ./.github/actions/setup-ios
                with:
                    xcode-version: ${{ env.XCODE_VERSION }}
                    gradle-cache-read-only: ${{ github.ref != 'refs/heads/main' }}

            -   name: 🧱 Link release framework
                run: ./gradlew :ios-framework:linkReleaseFrameworkIosArm64 -Papp.enableIos=true

            -   name: 📏 Measure framework size
                shell: bash
                run: |
                    ./scripts/ios-framework-size.sh | tee framework-size.txt
                    {
                      echo "## iOS framework size (release, iosArm64)"
                      echo '```'
                      cat framework-size.txt
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Upload size report
                uses: actions/upload-artifact@v7
                with:
                    name: ios-framework-size
                    path: framework-size.txt
